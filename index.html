<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A quiet placeholder for Axiur." />
  <title>Axiur</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0e1721;
    }

    body {
      overflow: hidden;
    }

    .hero {
      width: 100vw;
      height: 100vh;
      background-image: url("axiur-desert.png");
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }

    @media (max-width: 800px) {
      .hero {
        background-position: 48% center;
      }
    }
  </style>
</head>
<body>
  <main class="hero" role="img" aria-label="Axiur — A quiet place for a previous chapter."></main>
</body>
</html>
